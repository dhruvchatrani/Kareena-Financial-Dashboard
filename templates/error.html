<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kareena — Error</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-xl shadow-lg p-8 max-w-lg w-full mx-4 border-l-4 border-red-500">
        <div class="text-center mb-6">
            <div class="text-red-500 text-6xl mb-2">!</div>
            <h1 class="text-2xl font-bold text-gray-800">Something went wrong</h1>
        </div>
        <div class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
            <p class="text-red-700 font-mono text-sm break-words">{{ error }}</p>
        </div>
        {% if request_id %}
        <p class="text-xs text-gray-400 mb-4">Request ID: {{ request_id }}</p>
        {% endif %}
        <div class="flex gap-3 justify-center">
            <a href="/" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">Go to Dashboard</a>
            <a href="javascript:history.back()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition">Go Back</a>
        </div>
    </div>
</body>
</html>
